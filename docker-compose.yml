services:
  postgres-db:
    image: postgres:16.4-alpine3.20
    container_name: postgres-cosmic-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic
    ports:
    - "5432:5432"
    networks:
      - default
  pgadmin-ui:
    image: dpage/pgadmin4
    container_name: pgadmin-cosmic-ui
    environment:
      PGADMIN_DEFAULT_EMAIL: "david.socer@hotmail.com"
      PGADMIN_DEFAULT_PASSWORD: "5J4JgqSffm8f7rE"
    ports:
      - "16543:80"
    volumes:
      - pgadmin4-data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - default
volumes:
  pgadmin4-data:
networks:
  default:
    driver: bridge